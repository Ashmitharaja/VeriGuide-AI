<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VeriGuide AI</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1b2333; --muted:#6b7385; --line:#dfe3ec;
          --brand:#1f3c88; --ok:#1d9a5b; --warn:#c98a00; --bad:#c83a3a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:20px; } header small { opacity:.8; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns: 1fr 300px; gap:16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #chat { min-height:420px; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 12px; border-radius:10px; max-width:100%; }
  .user { background:#e8eefc; align-self:flex-end; }
  .bot { background:#f8f9fc; border:1px solid var(--line); }
  .answer { white-space:pre-wrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; color:#fff; font-size:12px; font-weight:600; }
  .High { background:var(--ok); } .Medium { background:var(--warn); } .Low { background:var(--bad); }
  .warn { color:var(--bad); font-size:13px; margin-top:6px; }
  details { margin-top:8px; font-size:13px; } summary { cursor:pointer; color:var(--brand); }
  .src { border-left:3px solid var(--brand); padding:4px 8px; margin:6px 0; background:#fff; }
  .claim { margin:4px 0; } .claim.ok::before { content:"✔ "; color:var(--ok); } .claim.no::before { content:"✖ "; color:var(--bad); }
  form { display:flex; gap:8px; margin-top:12px; }
  input[type=text] { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--brand); border:1px solid var(--line); padding:3px 8px; font-size:12px; }
  aside h3 { margin:0 0 8px; font-size:15px; } aside ul { padding-left:18px; margin:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .hbtn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); padding:6px 12px; font-size:13px; }
  .hbtn:hover { background:rgba(255,255,255,.25); }
  button.danger { color:var(--bad); }
  .doclist { list-style:none; padding:0; margin:4px 0; font-size:13px; }
  .doclist li { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid var(--line); }
  .doclist li span { overflow-wrap:anywhere; }
  .doclist .x { background:transparent; color:var(--bad); padding:0 6px; font-size:16px; line-height:1; }
  .empty { color:var(--muted); text-align:center; margin:auto; padding:40px 10px; }
  .examples button { display:block; width:100%; text-align:left; margin:4px 0; background:#eef2fb; color:var(--ink); font-size:13px; }
</style>
</head>
<body>
<header>
  <div><h1>VeriGuide AI</h1><small>Evidence-grounded troubleshooting assistant</small></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <small id="mode">loading…</small>
    <button id="newchat" class="hbtn" title="Clear the conversation and question history">+ New chat</button>
  </div>
</header>
<main>
  <section class="card">
    <div id="chat"></div>
    <form id="ask">
      <input id="q" type="text" placeholder="e.g. My motor is overheating. What could be the reason?" autocomplete="off" />
      <button>Ask</button>
    </form>
  </section>
  <aside>
    <div class="card examples">
      <h3>Try</h3>
      <button>My motor is overheating. What could be the reason?</button>
      <button>The pump is running but there is no flow</button>
      <button>What does fault code F07 mean on the VFD?</button>
      <button>Summarize the file</button>
      <button>How do I bake a chocolate cake?</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Knowledge base</h3>
      <ul id="docs" class="doclist"></ul>
      <input id="file" type="file" accept=".pdf,.md,.txt" style="margin-top:8px;max-width:100%" />
      <div id="upmsg" class="muted"></div>
      <button id="clearfiles" class="ghost danger" style="margin-top:8px">Remove all files</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Monitoring</h3>
      <div id="stats" class="muted"></div>
    </div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function refresh() {
  const s = await (await fetch("/api/status")).json();
  $("#mode").textContent = `Mode: ${s.mode} · ${s.chunks} chunks`;
  $("#docs").innerHTML = s.documents.map(d =>
    `<li><span>${esc(d.doc)} <span class="muted">(${d.chunks})</span></span>
     <button class="x" title="Delete ${esc(d.doc)}" data-doc="${esc(d.doc)}">✕</button></li>`).join("")
    || `<li class="muted">No files yet. Upload a PDF, .md or .txt manual.</li>`;
  $("#clearfiles").style.display = s.documents.length ? "" : "none";
  $("#docs").querySelectorAll("[data-doc]").forEach(b => b.onclick = async () => {
    if (!confirm(`Delete "${b.dataset.doc}" from the knowledge base?`)) return;
    $("#upmsg").textContent = "Deleting & re-indexing…";
    const r = await (await fetch("/api/documents/" + encodeURIComponent(b.dataset.doc), {method: "DELETE"})).json();
    $("#upmsg").textContent = r.detail || `Deleted ${r.deleted}`;
    refresh();
  });
  if (!$("#chat .msg")) showEmpty(s.documents.length);
  const t = await (await fetch("/api/stats")).json();
  const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
  $("#stats").innerHTML = `Queries: ${t.queries}<br>Abstain rate: ${pct(t.abstain_rate)}<br>
    Avg faithfulness: ${pct(t.avg_faithfulness)}<br>Feedback: 👍 ${t.thumbs_up || 0} · 👎 ${t.thumbs_down || 0}`;
}

function showEmpty(hasDocs) {
  $("#chat").innerHTML = `<div class="empty">${hasDocs
    ? "Ask a troubleshooting question, or type <b>summarize the file</b>."
    : "Upload a manual (PDF, .md or .txt) in the Knowledge base panel to get started."}</div>`;
}

function addMsg(cls, html) {
  $("#chat .empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("#chat").appendChild(d); d.scrollIntoView({behavior: "smooth"}); return d;
}

function render(r) {
  const claims = r.verification.claims.map(c =>
    `<div class="claim ${c.supported ? "ok" : "no"}">${esc(c.claim)} <span class="muted">(sim ${c.score} · ${esc(c.evidence_source)})</span></div>`).join("");
  const srcs = r.sources.map(s =>
    `<div class="src"><b>[${s.n}] ${esc(s.label)}</b> <span class="muted">score ${s.score}</span><br>${esc(s.text)}</div>`).join("");
  return `<span class="badge ${r.confidence}">Confidence: ${r.confidence}</span>
    ${r.abstained ? ' <span class="badge Low">Abstained</span>' : ""}
    <div class="answer" style="margin-top:6px">${esc(r.answer)}</div>
    ${r.warnings.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
    <details open><summary>Source citations (${r.sources.length})</summary>${srcs}</details>
    ${claims ? `<details><summary>Claim verification (${Math.round(r.verification.supported_ratio*100)}% supported)</summary>${claims}</details>` : ""}
    <div style="margin-top:8px"><button class="ghost" data-fb="1">👍 Helpful</button> <button class="ghost" data-fb="0">👎 Not helpful</button></div>`;
}

async function ask(q) {
  addMsg("user", esc(q));
  const box = addMsg("bot", "<span class='muted'>Retrieving evidence…</span>");
  try {
    const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: q})});
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail);
    box.innerHTML = render(r);
    box.querySelectorAll("[data-fb]").forEach(b => b.onclick = async () => {
      await fetch("/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({log_id: r.log_id, helpful: b.dataset.fb === "1"})});
      b.parentElement.innerHTML = "<span class='muted'>Thanks for the feedback.</span>"; refresh();
    });
  } catch (e) { box.innerHTML = `<span class="warn">Error: ${esc(e.message)}</span>`; }
  refresh();
}

$("#ask").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { $("#q").value = ""; ask(q); } };
document.querySelectorAll(".examples button").forEach(b => b.onclick = () => ask(b.textContent));
$("#newchat").onclick = async () => {
  if ($("#chat .msg") && !confirm("Start a new chat? This clears the conversation and question history.")) return;
  await fetch("/api/history", {method: "DELETE"});
  $("#chat").innerHTML = ""; $("#q").value = ""; $("#q").focus();
  refresh();
};
$("#clearfiles").onclick = async () => {
  if (!confirm("Remove ALL files from the knowledge base? The files are deleted from data/docs.")) return;
  $("#upmsg").textContent = "Removing…";
  const r = await (await fetch("/api/documents", {method: "DELETE"})).json();
  $("#upmsg").textContent = `Removed ${r.deleted.length} file(s)`;
  refresh();
};
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("#upmsg").textContent = "Uploading & indexing…";
  const fd = new FormData(); fd.append("file", f);
  const r = await (await fetch("/api/upload", {method: "POST", body: fd})).json();
  $("#upmsg").textContent = r.detail || `Indexed ${r.uploaded} (${r.chunks} chunks total)`;
  e.target.value = "";  // allow re-uploading the same file
  refresh();
};
refresh();
</script>
</body>
</html>
